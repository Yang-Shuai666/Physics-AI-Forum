name: Content check

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "reports/**"
      - "scripts/**"
      - "site.config.json"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate front matter and file names
        run: npm run validate

      - name: Build site + search index (dry run)
        run: npm run build:all
