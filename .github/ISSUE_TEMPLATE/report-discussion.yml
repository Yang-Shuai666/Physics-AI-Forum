name: 周报讨论
description: 为某份学习周报创建讨论主题（可直接用于团队讨论）
title: "[周报讨论] "
labels:
  - weekly-report
body:
  - type: markdown
    attributes:
      value: |
        请填写以下信息，发布后即可围绕这份周报开展讨论与互评。
  - type: input
    id: report_title
    attributes:
      label: 周报标题
      placeholder: 例如 2026-W42 团队学习周报
    validations:
      required: true
  - type: input
    id: report_link
    attributes:
      label: 周报链接
      description: 贴上本仓库 `reports/*.md` 文件链接
      placeholder: https://github.com/Yang-Shuai666/Physics-AI-Forum/blob/main/reports/2026-W42-team-learning.md
    validations:
      required: true
  - type: textarea
    id: discussion_points
    attributes:
      label: 本次想重点讨论的问题
      description: 建议使用编号列表，便于逐条回复
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: feedback_expectation
    attributes:
      label: 期望获得的反馈
      options:
        - 观点建议（方向判断、方法选择）
        - 资料补充（论文、博客、开源项目）
        - 实验设计建议（指标、对照组、数据集）
        - 排错建议（代码、复现实验问题）
        - 其他（请在下方补充）
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充背景（可选）
      description: 可补充你已尝试的方法、遇到的阻碍、希望大家优先关注的部分
      placeholder: 可选填写
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 发布前确认
      options:
        - label: 我已提供可访问的周报链接，并给出可讨论的具体问题
          required: true
    validations:
      required: true
